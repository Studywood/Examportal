<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Examportal</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #f6f8fc;
        }

        .admin-layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        .admin-sidebar {
            width: 240px;
            background: #111827;
            color: white;
            padding: 28px 16px;
        }

        .admin-sidebar h3 {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 14px;
            margin-bottom: 15px;
        }

        .admin-nav button {
            width: 100%;
            border: none;
            background: transparent;
            color: #cbd5e1;
            text-align: left;
            padding: 13px 14px;
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .admin-nav button:hover,
        .admin-nav button.active {
            background: #2563eb;
            color: white;
        }

        .admin-main {
            flex: 1;
            padding: 35px;
            max-width: 1400px;
        }

        .admin-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .admin-top h1 {
            font-size: 30px;
            margin-bottom: 6px;
        }

        .admin-top p {
            color: #64748b;
        }

        .admin-user {
            background: white;
            border: 1px solid #e5e7eb;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
        }

        .stat-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card h2 {
            font-size: 30px;
        }

        .admin-section {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 25px;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .section-heading h2 {
            font-size: 20px;
        }

        .create-test-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 17px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-test-btn:hover {
            background: #1d4ed8;
        }

        .empty-state {
            text-align: center;
            padding: 55px 20px;
            color: #64748b;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: #172033;
            margin-bottom: 8px;
        }

        .admin-logout {
            color: #fca5a5 !important;
            margin-top: 25px !important;
        }

        @media (max-width: 900px) {

            .admin-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .admin-sidebar {
                width: 200px;
            }
        }

        @media (max-width: 650px) {

            .admin-layout {
                display: block;
            }

            .admin-sidebar {
                width: 100%;
                padding: 15px;
            }

            .admin-sidebar h3 {
                display: none;
            }

            .admin-nav {
                display: flex;
                gap: 6px;
                overflow-x: auto;
            }

            .admin-nav button {
                white-space: nowrap;
                width: auto;
            }

            .admin-main {
                padding: 22px 16px;
            }

            .admin-top {
                display: block;
            }

            .admin-user {
                display: inline-block;
                margin-top: 15px;
            }

            .admin-stats {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        EXAM<span>PORTAL</span>
    </div>

    <div class="nav-buttons">
        <button onclick="logoutAdmin()">Logout</button>
    </div>

</header>


<div class="admin-layout">

    <!-- SIDEBAR -->

    <aside class="admin-sidebar">

        <h3>Admin Panel</h3>

        <nav class="admin-nav">

            <button class="active">
                Dashboard
            </button>

            <button onclick="showComingSoon('Tests')">
                Tests
            </button>

            <button onclick="showComingSoon('Students')">
                Students
            </button>

            <button onclick="showComingSoon('Results')">
                Results
            </button>

            <button onclick="showComingSoon('Settings')">
                Settings
            </button>

            <button
                class="admin-logout"
                onclick="logoutAdmin()">
                Logout
            </button>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="admin-main">

        <div class="admin-top">

            <div>

                <p class="tag">
                    ADMINISTRATION
                </p>

                <h1>
                    Dashboard
                </h1>

                <p>
                    Manage your Examportal platform.
                </p>

            </div>

            <div
                class="admin-user"
                id="adminUser">
                Admin
            </div>

        </div>


        <!-- STATISTICS -->

        <section class="admin-stats">

            <div class="stat-card">

                <p>Total Students</p>

                <h2 id="studentCount">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Total Tests</p>

                <h2 id="testCount">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Total Attempts</p>

                <h2 id="attemptCount">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Published Tests</p>

                <h2 id="publishedCount">
                    0
                </h2>

            </div>

        </section>


        <!-- TEST MANAGEMENT -->

        <section class="admin-section">

            <div class="section-heading">

                <div>
                    <h2>
                        Test Management
                    </h2>
                </div>

                <button
                    class="create-test-btn"
                    onclick="createTest()">

                    + Create Test

                </button>

            </div>


            <div class="empty-state">

                <div class="empty-icon">
                    📋
                </div>

                <h3>
                    No tests created yet
                </h3>

                <p>
                    Create your first mock test to make it
                    available to students.
                </p>

            </div>

        </section>

    </main>

</div>


<script>

    // ==============================
    // CHECK ADMIN LOGIN
    // ==============================

    const admin =
        JSON.parse(
            localStorage.getItem("examportal_admin")
        );

    if (!admin || admin.role !== "admin") {

        window.location.href =
            "admin.html";

    } else {

        document
            .getElementById("adminUser")
            .textContent =
            admin.username;

    }


    // ==============================
    // LOGOUT
    // ==============================

    function logoutAdmin() {

        localStorage.removeItem(
            "examportal_admin"
        );

        window.location.href =
            "admin.html";
    }


    // ==============================
    // CREATE TEST
    // ==============================

    function createTest() {

        alert(
            "Test Creator will be added next."
        );

    }


    // ==============================
    // OTHER SECTIONS
    // ==============================

    function showComingSoon(section) {

        alert(
            section +
            " management will be added next."
        );

    }

</script>

</body>
</html>
