<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Test - Examportal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">EXAM<span>PORTAL</span></div>

    <button class="nav-test-btn" onclick="window.location.href='dashboard.html'">
        Dashboard
    </button>
</header>

<main class="test-container">

    <div class="test-top">
        <div>
            <p class="tag">MOCK TEST</p>
            <h1 id="testTitle">Mathematics Test</h1>
        </div>

        <div class="timer">
            <small>TIME LEFT</small>
            <strong id="timer">30:00</strong>
        </div>
    </div>

    <div class="question-card">

        <div class="question-number">
            Question <span id="questionNumber">1</span>
        </div>

        <h2 id="questionText">
            Loading question...
        </h2>

        <div id="options"></div>

        <div class="test-navigation">
            <button id="previousBtn" onclick="previousQuestion()">
                ← Previous
            </button>

            <button id="nextBtn" onclick="nextQuestion()">
                Next →
            </button>
        </div>

    </div>

</main>

<script src="script.js"></script>

<script>
const questions = [
    {
        question: "If 2x + 5 = 15, what is the value of x?",
        options: ["2", "5", "10", "15"],
        answer: 1
    },
    {
        question: "What is the value of √49?",
        options: ["5", "6", "7", "8"],
        answer: 2
    },
    {
        question: "Which of the following is a prime number?",
        options: ["21", "27", "29", "33"],
        answer: 2
    },
    {
        question: "What is 15% of 200?",
        options: ["15", "20", "30", "40"],
        answer: 2
    },
    {
        question: "The degree of the polynomial 4x² + 3x + 1 is:",
        options: ["1", "2", "3", "4"],
        answer: 1
    }
];

let currentQuestion = 0;
let selectedAnswers = {};
let timeLeft = 30 * 60;

const subject =
    localStorage.getItem("selected_subject") || "Mathematics";

document.getElementById("testTitle").textContent =
    subject + " Mock Test";

function loadQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        currentQuestion + 1;

    document.getElementById("questionText").textContent =
        q.question;

    const options = document.getElementById("options");
    options.innerHTML = "";

    q.options.forEach((option, index) => {

        const label = document.createElement("label");
        label.className = "option";

        label.innerHTML = `
            <input type="radio"
                   name="answer"
                   value="${index}"
                   ${selectedAnswers[currentQuestion] == index ? "checked" : ""}>
            <span>${option}</span>
        `;

        label.querySelector("input").addEventListener("change", function() {
            selectedAnswers[currentQuestion] = index;
        });

        options.appendChild(label);
    });

    document.getElementById("previousBtn").disabled =
        currentQuestion === 0;

    document.getElementById("nextBtn").textContent =
        currentQuestion === questions.length - 1
            ? "Submit Test"
            : "Next →";
}

function nextQuestion() {

    if (currentQuestion === questions.length - 1) {
        submitTest();
        return;
    }

    currentQuestion++;
    loadQuestion();
}

function previousQuestion() {

    if (currentQuestion > 0) {
        currentQuestion--;
        loadQuestion();
    }
}

function submitTest() {

    let score = 0;

    questions.forEach((q, index) => {

        if (selectedAnswers[index] === q.answer) {
            score++;
        }

    });

    localStorage.setItem(
        "last_score",
        JSON.stringify({
            score: score,
            total: questions.length,
            subject: subject
        })
    );

    window.location.href = "result.html";
}

function updateTimer() {

    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

    if (timeLeft <= 0) {
        submitTest();
        return;
    }

    timeLeft--;
}

setInterval(updateTimer, 1000);

loadQuestion();
</script>

</body>
</html>
