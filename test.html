<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Test - Examportal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">EXAM<span>PORTAL</span></div>

    <button class="nav-test-btn" onclick="window.location.href='dashboard.html'">
        Dashboard
    </button>
</header>

<main class="test-container">

    <div class="test-top">
        <div>
            <p class="tag">MOCK TEST</p>
            <h1 id="testTitle">Loading Test...</h1>
        </div>

        <div class="timer">
            <small>TIME LEFT</small>
            <strong id="timer">--:--</strong>
        </div>
    </div>

    <div class="question-card">

        <div class="question-number">
            Question <span id="questionNumber">1</span>
        </div>

        <h2 id="questionText">
            Loading question...
        </h2>

        <div id="options"></div>

        <div class="test-navigation">
            <button id="previousBtn" onclick="previousQuestion()">
                ← Previous
            </button>

            <button id="nextBtn" onclick="nextQuestion()">
                Next →
            </button>
        </div>

    </div>

</main>

<script>
const API =
    "https://examportal-api.abhinandanofficial-naha.workers.dev";

let questions = [];
let currentQuestion = 0;
let selectedAnswers = {};
let timeLeft = 0;
let timerInterval = null;

const subject =
    localStorage.getItem("selected_subject") || "All";

const savedUser =
    localStorage.getItem("examportal_user") ||
    sessionStorage.getItem("examportal_user");

let user = null;

try {
    user = savedUser ? JSON.parse(savedUser) : null;
} catch {
    user = null;
}


// ==========================================
// LOAD TEST FROM API
// ==========================================

async function loadTest() {

    try {

        const response =
            await fetch(API + "/tests");

        const result =
            await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.message || "Unable to load tests."
            );
        }

        let tests = result.tests || [];

        // Filter by student's class
        if (user && user.classNumber) {
            tests = tests.filter(function(test) {
                return (
                    test.class_number == user.classNumber
                );
            });
        }

        // Filter by selected subject
        if (subject !== "All") {
            tests = tests.filter(function(test) {
                return (
                    test.subject === subject
                );
            });
        }

        if (tests.length === 0) {

            document.getElementById("testTitle").textContent =
                "No Test Available";

            document.getElementById("questionText").textContent =
                "There is currently no test available for this class and subject.";

            document.getElementById("options").innerHTML = "";

            document.getElementById("previousBtn").style.display =
                "none";

            document.getElementById("nextBtn").style.display =
                "none";

            document.getElementById("timer").textContent =
                "--:--";

            return;
        }

        // Use the newest test
        const test = tests[0];

        document.getElementById("testTitle").textContent =
            test.title;

        // Read questions stored in D1
        questions =
            typeof test.questions_json === "string"
                ? JSON.parse(test.questions_json)
                : test.questions_json;

        if (!Array.isArray(questions) || questions.length === 0) {
            throw new Error("This test has no questions.");
        }

        // Use actual test duration
        const duration =
            Number(test.duration_minutes);

        timeLeft =
            duration > 0
                ? duration * 60
                : 30 * 60;

        loadQuestion();
        updateTimer();

        timerInterval =
            setInterval(updateTimer, 1000);

    } catch (error) {

        console.error(error);

        document.getElementById("testTitle").textContent =
            "Unable to Load Test";

        document.getElementById("questionText").textContent =
            error.message;

        document.getElementById("options").innerHTML = "";

        document.getElementById("previousBtn").style.display =
            "none";

        document.getElementById("nextBtn").style.display =
            "none";

        document.getElementById("timer").textContent =
            "--:--";
    }
}


// ==========================================
// LOAD QUESTION
// ==========================================

function loadQuestion() {

    const q =
        questions[currentQuestion];

    if (!q) {
        return;
    }

    document.getElementById("questionNumber").textContent =
        currentQuestion + 1;

    document.getElementById("questionText").textContent =
        q.question || "";

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    const optionList =
        q.options || [];

    optionList.forEach(function(option, index) {

        const label =
            document.createElement("label");

        label.className = "option";

        label.innerHTML = `
            <input
                type="radio"
                name="answer"
                value="${index}"
                ${selectedAnswers[currentQuestion] == index ? "checked" : ""}
            >
            <span>${option}</span>
        `;

        label
            .querySelector("input")
            .addEventListener(
                "change",
                function() {
                    selectedAnswers[currentQuestion] =
                        index;
                }
            );

        options.appendChild(label);
    });

    document.getElementById("previousBtn").disabled =
        currentQuestion === 0;

    document.getElementById("nextBtn").textContent =
        currentQuestion === questions.length - 1
            ? "Submit Test"
            : "Next →";
}


// ==========================================
// NEXT QUESTION
// ==========================================

function nextQuestion() {

    if (
        currentQuestion ===
        questions.length - 1
    ) {
        submitTest();
        return;
    }

    currentQuestion++;

    loadQuestion();
}


// ==========================================
// PREVIOUS QUESTION
// ==========================================

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        loadQuestion();
    }
}


// ==========================================
// CHECK ANSWER
// ==========================================

function isCorrectAnswer(question, selectedIndex) {

    if (
        selectedIndex === undefined ||
        selectedIndex === null
    ) {
        return false;
    }

    const answer = question.answer;

    // Numeric answer = option index
    if (typeof answer === "number") {
        return selectedIndex === answer;
    }

    // String containing option index
    if (
        typeof answer === "string" &&
        /^\d+$/.test(answer)
    ) {
        return selectedIndex === Number(answer);
    }

    // String containing actual answer text
    if (typeof answer === "string") {

        const selectedOption =
            question.options?.[selectedIndex];

        return (
            selectedOption &&
            selectedOption.trim() ===
            answer.trim()
        );
    }

    return false;
}


// ==========================================
// SUBMIT TEST
// ==========================================

function submitTest() {

    if (timerInterval) {
        clearInterval(timerInterval);
    }

    let score = 0;

    questions.forEach(function(q, index) {

        if (
            isCorrectAnswer(
                q,
                selectedAnswers[index]
            )
        ) {
            score++;
        }
    });

    localStorage.setItem(
        "last_score",
        JSON.stringify({
            score: score,
            total: questions.length,
            subject: subject
        })
    );

    window.location.href =
        "result.html";
}


// ==========================================
// TIMER
// ==========================================

function updateTimer() {

    const minutes =
        Math.floor(timeLeft / 60);

    const seconds =
        timeLeft % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

    if (timeLeft <= 0) {

        if (timerInterval) {
            clearInterval(timerInterval);
        }

        submitTest();

        return;
    }

    timeLeft--;
}


// ==========================================
// START
// ==========================================

loadTest();
</script>

</body>
</html>
